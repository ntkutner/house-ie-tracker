# ---------------------------------------------------------------------------
# Candidates to leave out entirely. A name drops every filing naming that person in
# any race; a key (FEC ID or RACE:LASTNAME) drops just that one.
# ---------------------------------------------------------------------------
[exclusions]
candidates = [
  "SHAWN BETTIS",   # not a real candidate; bogus filings (one for $3 billion)
  "SETH BODNAR",    # running for Senate, filed under House by mistake
  "H6IL04195",      # Christopher Getty (IL-04), independent
  "H6IA01213",      # Michael Bridgford (IA-01), independent
  "H4ME02093",      # John Baldacci, Maine ID filed against an Iowa race
  "CA47:BAUGH",     # Scott Baugh (CA-47)
  "RYAN ZINKE",     # MT-01 incumbent, retired; not on the November ballot
]
# Races to leave out entirely (spending there was for special elections).
races = ["GA14", "CA01", "FL06", "TN07",
         "KS00", "SC00"]   # KS00/SC00: Senate spending (Marshall, Andrews) mis-filed as House

# ---------------------------------------------------------------------------
# Spending categories for the per-group breakdown (independent expenditures only;
# coordinated party spending isn't categorized). Each expenditure's purpose text, as
# the filer wrote it, is checked against these in order; the first match wins, and
# anything unmatched is "Other". Patterns are case-insensitive regexes.
# Production catches production-only descriptions ("Media Production"); combined
# "Advertising & Media Production" buys go to their channel or Paid Media (general).
# ---------------------------------------------------------------------------
[[categories]]
name = "Texting"
patterns = ['\btext(s|ing|ed)?\b', '\bsms\b', '\bmms\b', 'peer[- ]to[- ]peer', '\bp2p\b']

[[categories]]
name = "Phones"
patterns = ['phone', '\bcall(s|ing)?\b', '\bivr\b', 'robo', 'tele-?town']

[[categories]]
name = "Production"
patterns = ['^(?!.*(advertis|\bbuy\b|placement|airtime)).*production']

[[categories]]
name = "CTV/Streaming"
patterns = ['\bctv\b', '\bott\b', 'connected\s*tv', 'stream', 'over[- ]the[- ]top', '\bhulu\b', '\broku\b']

[[categories]]
name = "Cable"
patterns = ['\bcable\b', 'satellite']

[[categories]]
name = "Radio"
patterns = ['\bradio\b']

[[categories]]
name = "Broadcast"
patterns = ['broadcast', '\btv\b', 'television', '\bairtime\b']

[[categories]]
name = "Direct Mail"
patterns = ['(?<![e-])\bmail', 'postage', 'mailer', 'mailing']

[[categories]]
name = "Canvassing/Lit"
patterns = ['canvass', '\bdoor', '\bfield\b', '\blit(erature)?\b', 'walk', 'palm ?card', 'door ?hanger', '\bgotv\b']

[[categories]]
name = "Digital (general)"
patterns = ['digital', 'online', 'internet', 'social', 'facebook', '\bmeta\b', 'google', 'search', 'display', 'programmatic', 'youtube', 'e-?mail', '\bweb', '\bsem\b', '\bseo\b']

[[categories]]
name = "Paid Media (general)"
patterns = ['media', 'advertis', '\bads?\b', 'ad buy', 'production', 'placement', '\bbuy\b', 'commercial', '\bspot']

# ---------------------------------------------------------------------------
# Outside-group filters. Each block adds an option to the page's "Outside groups"
# menu; picking it shows only that set of groups' spending in every race, total and
# drill-down. Groups keep their normal columns (most land in OTH R / OTH D), and a
# network that spends on both sides is split by who each expenditure helps.
# A spender matches by FEC ID or by name pattern (case-insensitive regex, matched
# against the spender name as filed). Data notes lists exactly which filers matched.
# ---------------------------------------------------------------------------
[[spender_groups]]
name = "AI industry"
members = ["Leading the Future", "Think Big PAC", "American Mission PAC", "Build American AI",
           "Public First Action", "Public First PAC", "Jobs and Democracy PAC", "Defending Our Values PAC",
           "Guardrails Alliance", "You Can Push Back", "Dream NYC", "Tomorrow Together",
           "Innovation Council (super PAC)", "Innovation Council Action", "Building the Future",
           "Race for the Future", "Anthropic PBC Political Action Committee",
           "NVPAC (NVIDIA Corporation Employees Federal PAC)"]
ids = ["C00916114",   # Leading the Future
       "C00923417",   # Think Big
       "C00916692",   # American Mission
       "C00930503",   # Public First
       "C00928374",   # Jobs and Democracy PAC
       "C00928390",   # Defending Our Values PAC
       "C00949487",   # Guardrails Alliance
       "C00946830",   # You Can Push Back
       "C00928069",   # Dream NYC
       "C00958603",   # Tomorrow Together
       "C00922815",   # Innovation Council
       "C00960328",   # Building the Future
       "C00909911",   # Race for the Future
       "C00946111",   # Anthropic PBC PAC (AnthroPAC)
       "C00960070"]   # NVPAC
name_patterns = ['^LEADING THE FUTURE\b', '^THINK BIG\b(?!,? AMERICA)', '^AMERICAN MISSION\b',
                 '^BUILD AMERICAN AI\b', '^PUBLIC FIRST\b', '^JOBS (AND|&) DEMOCRACY\b',
