# House IE Tracker configuration. Edit this file, commit, and the next run rebuilds.

cycle = 2026   # two-year FEC period (2026 = 2025-2026)

[sources]
# FEC bulk file of 24- and 48-hour independent expenditure reports. No API key needed.
ie_url = "https://www.fec.gov/files/bulk-downloads/{cycle}/independent_expenditure_{cycle}.csv"
# FEC candidate master file, used for clean names, incumbency, and party when filers leave it blank.
candidate_master_url = "https://www.fec.gov/files/bulk-downloads/{cycle}/cn{yy}.zip"
# FEC file of committee contributions/expenditures to candidates. Used for party coordinated
# expenditures (transaction type 24C) for any column marked coordinated = true.
coordinated_url = "https://www.fec.gov/files/bulk-downloads/{cycle}/pas2{yy}.zip"
# Optional. Two columns: district,margin  e.g.  CO08,R+1.8   or   NY17,D+0.6
pres_margins_csv = "pres_margins_2024.csv"

[filters]
election_types = ["G"]   # G = general election. Add "S" to include special elections.
# "party": show races where any named column below has spent (matches the original chart).
# "all":   show every House race with general-election IEs. The page has a toggle either way.
races = "party"
# Coordinated "memo" entries are spending disseminated but not yet paid. They're counted (as the FEC
# recommends) unless a regular entry for the same party, candidate and amount shows the payment.
coordinated_include_memos = true

[display]
title = "2026 House Battlefield Independent Expenditure Dashboard"
other_r_label = "OTH R"
other_d_label = "OTH D"

# ---------------------------------------------------------------------------
# Named columns, in display order. A spender matches by FEC ID or by name pattern
# (case-insensitive regex). Money is put on a side by who it helps: supporting a
# Republican or opposing a Democrat is R-side, and vice versa. Anything that is not
# matched here lands in OTH R / OTH D. To give another group its own column,
# copy a block. The page's "Data notes" lists the biggest unmatched groups.
# ---------------------------------------------------------------------------

[[columns]]
key = "CLF"
label = "CLF"
side = "R"
ids = ["C00504530"]
name_patterns = ['^CONGRESSIONAL LEADERSHIP FUND']
# To fold in CLF's sister group, add:  '^AMERICAN ACTION NETWORK'  to the list above.

[[columns]]
key = "NRCC"
label = "NRCC"
side = "R"
ids = ["C00075820"]
name_patterns = ['^NRCC\b', 'NATIONAL REPUBLICAN CONGRESSIONAL']
coordinated = true   # also count party coordinated expenditures (Schedule F) by these IDs

[[columns]]
key = "TRUMP"
label = "TRUMP"
side = "R"
# MAGA Inc. plus the Trump-aligned spending vehicles No Going Back PAC and Safety and Affordability PAC.
ids = ["C00892471"]
name_patterns = ['^MAGA,? INC', '^NO GOING BACK PAC', '^SAFETY (AND|&) AFFORDABILITY PAC']

[[columns]]
key = "ELON"
label = "ELON"
side = "R"
ids = ["C00879510"]                # America PAC (Elon Musk)
name_patterns = ['^AMERICA PAC\b']

[[columns]]
key = "HMP"
label = "HMP"
side = "D"
ids = ["C00495028"]
name_patterns = ['^HOUSE MAJORITY PAC']

[[columns]]
key = "DCCC"
label = "DCCC"
side = "D"
ids = ["C00000935"]
name_patterns = ['^DCCC\b', 'DEMOCRATIC CONGRESSIONAL CAMPAIGN']
coordinated = true   # also count party coordinated expenditures (Schedule F) by these IDs

# ---------------------------------------------------------------------------
# Party overrides. Key = the candidate as Data notes lists it: an FEC candidate ID
# (H6AK01092) or, for filings with no ID, race and last name as filed (VA02:LURIA).
# Value = the side the candidate counts on: "REP" or "DEM".
# ---------------------------------------------------------------------------
[party_overrides]
"H2CA03157" = "REP"    # Kevin Kiley (CA-06); filers report his party as OTHER
"H6AK01092" = "DEM"    # Bill Hill (AK-AL), independent counted with Democrats
"AK00:HAFNER" = "REP"  # Eric Hafner (AK-AL): spending against him helps Bill Hill, so it counts
                       # as helping Democrats (and spending for him as helping Republicans)
"H0NJ07089" = "REP"    # Tom Kean (NJ-07)
"VA02:LURIA" = "DEM"   # Elaine Luria (VA-02)
"H4NY04158" = "DEM"    # Laura Gillen (NY-04)
"H4PA07118" = "REP"    # Ryan Mackenzie (PA-07)
"H8NV03200" = "DEM"    # Susie Lee (NV-03)
"H8VA05106" = "DEM"    # Tom Perriello (VA-05)
"H4CA45170" = "DEM"    # Derek Tran (CA-45)
"OH13:SKYES" = "DEM"   # Emilia Sykes (OH-13), misspelled by the filer

# Third-party and independent candidates whose party no filing or FEC record gives. Their IEs show
# in the race's detail (not in the D/R totals). Key = FEC ID or RACE:LASTNAME; value = the party,
# or { party = "...", district = "XX01" } to also move filings that named the wrong district.
[third_party]
"IA02:STEWART" = "Libertarian"   # Rick Stewart (IA-02)
"CO08:WOOD" = "Libertarian"      # Dave Wood (CO-08)
"MT00:SHEEDY" = { party = "Libertarian", district = "MT01" }   # Nick Sheedy (MT-01); some filings say MT-00
"MT01:SHEEDY" = "Libertarian"

# Filings that name a candidate wrongly, to be counted toward the right candidate in the
# same race. Key = the candidate as Data notes lists it; value = the right last name.
[candidate_aliases]
"TX28:CUELLER" = "CUELLAR"   # Henry Cuellar (TX-28), misspelled by the filer

