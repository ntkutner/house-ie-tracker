name: FEC diagnostics (temporary)
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: diag }
      - name: Probe FEC
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: |
          pip install fecfile
          python diag/probe.py > diag/out.txt 2>&1 || true
      - name: Save
        run: |
          git config user.name diag-bot; git config user.email diag@users.noreply.github.com
          git add diag/out.txt; git commit -m "diag output"; git push origin diag
