name: Update House IE tracker

on:
  schedule:
    - cron: "23 * * * *"   # hourly; does nothing if the FEC file hasn't changed
  workflow_dispatch:        # "Run workflow" button for manual refreshes
    inputs:
      force:
        description: "Rebuild even if the FEC file hasn't changed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ie-tracker
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python tracker.py ${{ inputs.force && '--force' || '' }}
      - name: Publish if anything changed
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            git config user.name  "ie-tracker-bot"
            git config user.email "ie-tracker-bot@users.noreply.github.com"
            git add docs
            git commit -m "IE data update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No changes."
          fi
