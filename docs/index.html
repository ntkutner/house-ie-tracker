<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026 House Battlefield Independent Expenditure Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;600;700&family=Public+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff; --ink:#1a1d23; --muted:#5d6572; --rule:#d9dde3; --alt:#f5f6f8;
  --r:#b0222b; --r-tint:#f7d9db; --r-wash:#fcefef;
  --d:#1c4c9c; --d-tint:#d8e3f5; --d-wash:#eef3fb;
  --focus:#1c4c9c;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"IBM Plex Sans Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#16181d; --ink:#e7e9ed; --muted:#9aa2ae; --rule:#2f343c; --alt:#1c1f25;
  --r:#ff7a7f; --r-tint:#4a2226; --r-wash:#2a1d20; --d:#86aef5; --d-tint:#1f3358; --d-wash:#1b2333; --focus:#86aef5;
}}
:root[data-theme="dark"]{
  --paper:#16181d; --ink:#e7e9ed; --muted:#9aa2ae; --rule:#2f343c; --alt:#1c1f25;
  --r:#ff7a7f; --r-tint:#4a2226; --r-wash:#2a1d20; --d:#86aef5; --d-tint:#1f3358; --d-wash:#1b2333; --focus:#86aef5;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1680px;margin:0 auto;padding:28px 20px 48px}

/* Hero: the split of money is the headline */
header h1{font:700 clamp(22px,2.6vw,32px)/1.15 var(--sans);margin:0;letter-spacing:-.01em}
.seats{font:600 15px var(--cond);color:var(--muted);margin-top:4px}
.split{margin:22px 0 6px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:end}
.split .amt{font:700 clamp(20px,2.4vw,30px)/1 var(--cond);font-variant-numeric:tabular-nums}
.split .who{font:500 13px var(--cond);color:var(--muted);display:block;margin-bottom:4px}
.split .rep .amt{color:var(--r)} .split .dem{text-align:right} .split .dem .amt{color:var(--d)}
.split .mid{text-align:center;font:600 14px var(--cond);color:var(--muted);padding-bottom:3px}
.bar{display:flex;height:14px;border-radius:2px;overflow:hidden;background:var(--rule)}
.bar i{display:block;height:100%;transition:width .5s ease}
.bar .r{background:var(--r)} .bar .d{background:var(--d)}
.stamp{margin-top:10px;font:400 13px var(--cond);color:var(--muted)}
.note{margin:16px 0 0;padding:10px 14px;border-left:4px solid var(--r);background:var(--r-wash);font-size:14px}


/* Blue header band */
header.band{background:#1747C9;color:#fff;font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding:36px clamp(16px,3vw,40px) 40px}
.band .band-inner{max-width:1680px;margin:0 auto;display:flex;flex-direction:column;gap:36px}
.band .toprow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:24px}
.band .titleblock{display:flex;flex-direction:column;gap:12px;flex:1 1 560px;min-width:0}
.band .kicker{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;opacity:.85}
.band h1{margin:0;max-width:900px;font:800 40px/1.08 "Public Sans",system-ui,sans-serif;letter-spacing:-.02em}
.band nav{display:flex;gap:24px;font-size:15px;font-weight:600;padding-top:2px}
.band nav a{text-decoration:none} .band nav a:hover{text-decoration:underline}
.band .totals{display:flex;flex-direction:column;gap:14px}
.band .nums{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px}
.band .lbl{font-size:14px;font-weight:600;opacity:.85}
.band .amt{font-size:40px;line-height:1.1;font-weight:800;font-variant-numeric:tabular-nums}
.band .amt.r{color:#FFC9C4} .band .right{text-align:right}
.band .bar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:rgba(255,255,255,.2)}
.band .bar .d{background:#fff} .band .bar .r{background:#F08A82}
.band .caption{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:14px;font-weight:600}
.band :focus-visible{outline-color:#fff}
.under{display:flex;flex-direction:column;gap:6px;margin-bottom:4px}
@media (max-width:700px){.band h1{font-size:28px}.band .amt{font-size:30px}}

/* Controls */
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:26px 0 12px}
.controls input[type=search]{flex:1 1 260px;max-width:420px;font:15px var(--sans);padding:8px 12px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.seg button{font:600 14px var(--cond);padding:7px 12px;border:0;background:var(--paper);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.dl{margin-left:auto;font:500 14px var(--cond);display:flex;gap:14px}
.dl a{color:var(--muted)}

/* Table */
.scroller{overflow-x:auto;border:1px solid var(--rule);border-radius:4px}
table{border-collapse:collapse;width:100%;font:500 13px/1.25 var(--cond);font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;white-space:nowrap;border-bottom:1px solid var(--rule)}
thead th{position:sticky;top:0;z-index:2;background:var(--paper);font-weight:700;text-align:right;cursor:pointer;user-select:none;border-bottom:2px solid var(--ink)}
thead tr.groups th{position:static;cursor:default;border-bottom:0;font-weight:600;font-size:12px;text-align:center;padding:4px 8px}
thead tr.groups th.g-r{background:var(--r-tint);color:var(--r)} thead tr.groups th.g-d{background:var(--d-tint);color:var(--d)}
thead th.l,td.l{text-align:left}
thead th.rc{background:var(--r-tint)} thead th.dc{background:var(--d-tint)}
thead th[aria-sort] span::after{content:"";display:inline-block;margin-left:3px;border:4px solid transparent}
thead th[aria-sort="descending"] span::after{border-top-color:currentColor;transform:translateY(2px)}
thead th[aria-sort="ascending"] span::after{border-bottom-color:currentColor;transform:translateY(-2px)}
td{text-align:right}
td.rc{background:var(--r-wash)} td.dc{background:var(--d-wash)}
td.sum{font-weight:700}
td.zero{color:var(--muted);opacity:.55}
.sticky{position:sticky;left:0;z-index:1;background:inherit}
thead th.sticky{z-index:3}
tbody tr.race{cursor:pointer;background:var(--paper)}
tbody tr.race.alt{background:var(--alt)}
tbody tr.race:hover td{filter:brightness(.97)}
tbody tr.race[aria-expanded="true"] td{border-bottom-color:transparent}
td.dist{font-weight:700}
.rtag{display:inline-block;margin-left:6px;padding:0 5px;border-radius:3px;background:var(--alt);border:1px solid var(--rule);color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.02em;vertical-align:1px;white-space:nowrap}
td.none,td.rep.none,td.dem.none{color:var(--muted);font-weight:400;font-style:italic}
.vs{font-weight:400;color:var(--muted)}
td.sp-adv{color:var(--muted);font-weight:600}
.credit{margin:22px 0 0;padding-top:14px;border-top:1px solid var(--rule);font-size:13px;color:var(--muted);text-align:center}
td.rep{color:var(--r);font-weight:600} td.dem{color:var(--d);font-weight:600}
.inc{font-weight:400;opacity:.7;margin-left:3px}
.adv-r{color:var(--r);font-weight:700} .adv-d{color:var(--d);font-weight:700}
.pres-r{color:var(--r)} .pres-d{color:var(--d)}
tfoot td{font-weight:700;background:var(--paper);border-top:2px solid var(--ink)}
tfoot tr.counts td{font-weight:500;color:var(--muted);border-top:0}

/* Drill-down */
tr.detail td{padding:0 0 14px;background:var(--paper);text-align:left}
.detail-inner{padding:10px 12px 0 calc(8px + 4em);display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:18px}
.detail h3{font:700 13px var(--cond);margin:0 0 6px;padding-bottom:4px;border-bottom:2px solid currentColor}
.detail .side-r h3{color:var(--r)} .detail .side-d h3{color:var(--d)}
.sp{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:5px 0;border-bottom:1px solid var(--rule);font:500 13px/1.3 var(--cond)}
.sp .nm{font-weight:600;white-space:normal}
.sp .nm a{text-decoration:none} .sp .nm a:hover{text-decoration:underline}
.sp .tag{display:inline-block;font-size:11px;font-weight:700;padding:0 5px;border-radius:2px;margin-left:6px;vertical-align:1px}
.side-r .tag{background:var(--r-tint);color:var(--r)} .side-d .tag{background:var(--d-tint);color:var(--d)}
.sp .meta{grid-column:1/-1;color:var(--muted);font-weight:400;white-space:normal}
.sp .am{font-variant-numeric:tabular-nums;font-weight:700}
.detail .links{grid-column:1/-1;font:500 13px var(--cond)}
.empty{padding:28px;text-align:center;color:var(--muted)}

.foot{font:400 13px var(--cond);color:var(--muted);margin:8px 0 0}

/* Group spending breakdown */
.sp[data-sp]{cursor:pointer;border-radius:4px}
.sp[data-sp]:hover{background:var(--alt)}
.sp .chev{display:inline-block;width:0;height:0;margin-right:6px;border:4px solid transparent;border-left:5px solid currentColor;vertical-align:1px;transition:transform .15s ease}
.sp[aria-expanded="true"] .chev{transform:rotate(90deg) translate(2px,-2px)}
.sp-panel{grid-column:1/-1;margin:6px 0 4px;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);cursor:default}
.cats{display:grid;grid-template-columns:minmax(110px,max-content) 1fr auto;gap:5px 10px;align-items:center;font:500 12px/1.2 var(--cond)}
.cats .track{height:8px;background:var(--alt);border-radius:2px;overflow:hidden}
.cats .fill{height:100%;border-radius:2px}
.side-r .cats .fill{background:var(--r)} .side-d .cats .fill{background:var(--d)}
.cats .v{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.cats .pct{color:var(--muted);font-weight:400;margin-left:4px}
.items{margin-top:10px;max-height:300px;overflow:auto;border-top:1px solid var(--rule)}
.it{display:grid;grid-template-columns:48px 1fr auto;gap:1px 10px;padding:6px 0;border-bottom:1px solid var(--rule);font:400 12px/1.3 var(--cond)}
.it:last-child{border-bottom:0}
.it .dt{color:var(--muted);white-space:nowrap}
.it .ds{font-weight:600;color:var(--ink)}
.it .n{font-weight:700;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.it .sub{grid-column:2/-1;color:var(--muted)}
.sp-panel .fec{margin-top:8px;font:500 12px var(--cond)}
.items .loading{padding:8px 0;color:var(--muted)}

/* Spending-type filter */
.catpick{position:relative;font:600 14px var(--cond)}
.catpick summary{list-style:none;cursor:pointer;height:36px;display:flex;align-items:center;gap:6px;padding:0 12px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);color:var(--muted)}
.catpick summary::-webkit-details-marker{display:none}
.catpick summary::after{content:"";border:4px solid transparent;border-top-color:currentColor;margin:4px 0 0 2px}
.catpick summary b{color:var(--ink);font-weight:700}
.catpick.on summary{border-color:var(--d);box-shadow:0 0 0 1px var(--d)}
.catmenu{position:absolute;z-index:10;top:42px;left:0;min-width:240px;padding:10px 12px;background:var(--paper);border:1px solid var(--rule);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.catmenu label{display:flex;align-items:center;gap:8px;padding:5px 2px;font-weight:500;color:var(--ink);cursor:pointer}
.catmenu input{width:16px;height:16px;accent-color:var(--d)}
.catbtns{display:flex;gap:8px;padding-bottom:8px;margin-bottom:4px;border-bottom:1px solid var(--rule)}
.catbtns button{border:0;background:none;padding:2px 0;color:var(--d);font:600 13px var(--cond);cursor:pointer;text-decoration:underline}
.catnote{margin:0 0 10px;padding:8px 12px;border-radius:4px;background:var(--d-wash);color:var(--ink);font:500 14px var(--cond)}
.cats span.sel{font-weight:800}
/* Notes */
details.notes{margin-top:28px;border-top:1px solid var(--rule);padding-top:12px;font-size:14px;max-width:1100px}
details.notes summary{font:700 15px var(--sans);cursor:pointer}
.notes h4{font:700 14px var(--sans);margin:18px 0 6px}
.notes p,.notes li{color:var(--muted);max-width:75ch}
.notes table{font-size:13px;width:auto;margin-top:6px}
.notes td,.notes th{text-align:left;padding:3px 10px 3px 0;border-bottom:1px solid var(--rule)}
.notes td.n{text-align:right}

@media (max-width:700px){
  .wrap{padding:18px 12px 36px}
  .dl{margin-left:0}
  .detail-inner{padding-left:12px;grid-template-columns:1fr;position:sticky;left:0;width:calc(100vw - 26px)}
  .split{grid-template-columns:1fr 1fr}
  .split .mid{grid-column:1/-1;grid-row:2;text-align:left;padding:0}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

<div class="wrap">

  </div>

  <p class="catnote" id="catnote" hidden></p>
  <div class="scroller"><table id="tbl"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>

  <div class="under"><p class="foot" id="foot"></p><p class="foot" id="checked"></p></div>

  <details class="notes" id="notes"><summary>Data notes and methodology</summary><div id="notesBody"></div></details>
  <p class="credit">Built by Noah Kutner using public FEC data. Figures reflect filings as reported and may change with amendments.</p>
</div>

// With a spending type selected, rebuild each race from its groups' spending in that category.

const filtering = () => state.cats.size < catList.length;
function view(r) {
  const sel = state.cats;
  if (!filtering()) return r;
  const cols = {}, spenders = [];
  let rt = 0, dt = 0, n7 = 0;
  for (const s of r.spenders) {
    if (s.kind === "COORD") continue;
    const amt = s.cats.reduce((a, c) => a + (sel.has(c[0]) ? c[1] : 0), 0);
    if (!amt) continue;
    cols[s.col] = (cols[s.col] || 0) + amt;
    if (s.side === "R") rt += amt; else dt += amt;
    const pick = o => [...sel].map(c => (o || {})[c]).filter(Boolean);
    n7 += pick(s.cat_new7).reduce((a, v) => a + v, 0);
    spenders.push({...s, amount: amt, n: pick(s.cat_n).reduce((a, v) => a + v, 0),
                   last: pick(s.cat_last).sort().pop() || s.last});
  }
  spenders.sort((a, b) => b.amount - a.amount);
  return {...r, cols, spenders, r_total: rt, d_total: dt, total: rt + dt, adv: dt - rt, new7: n7};
}

function visible() {
  const q = state.q.trim().toLowerCase();
  let rows = DATA.races.map(view).filter(r => (state.view === "all" || r.party_race) && (!filtering() || Math.round(r.total) !== 0));
  if (q) rows = rows.filter(r => [r.district, r.rep?.name, r.dem?.name, ...r.spenders.map(s => s.name)]
                                  .some(v => (v || "").toLowerCase().includes(q)));
  const f = FIELDS.find(f => f.key === state.sort);
  return rows.slice().sort((a, b) => {
    const x = f.get(a), y = f.get(b);
    const c = f.sort === "str" ? String(x).localeCompare(String(y)) : x - y;
    return c * state.dir || b.total - a.total;
  });
}

function presCell(m) {
  if (m == null) return "";
  if (m === 0) return "EVEN";
  return m > 0 ? `<span class="pres-r">TRUMP+${m.toFixed(1)}</span>` : `<span class="pres-d">HARRIS+${Math.abs(m).toFixed(1)}</span>`;
}

function cell(f, r) {
  const v = f.get(r);
  const sp = r.same_party;
  if (f.key === "district") {
    const tag = sp ? `<span class="rtag">${sp.party === "DEM" ? "D v D" : "R v R"}</span>` : (r.note ? `<span class="rtag">${esc(r.note)}</span>` : "");
    return `<td class="${f.cls}">${esc(v)}${tag}</td>`;
  }
  if (f.key === "pres") return `<td>${presCell(r.pres)}</td>`;
  if (f.key === "rep" || f.key === "dem") {
    if (sp) {
      const mine = (f.key === "dem") === (sp.party === "DEM");
      return mine ? `<td class="${f.cls}">${sp.candidates.map(esc).join(' <span class="vs">vs.</span> ')}</td>`
                  : `<td class="${f.cls} none">No ${f.key === "dem" ? "Democrat" : "Republican"} (top-two)</td>`;
    }
    const c = r[f.key];
    return `<td class="${f.cls}">${c ? esc(c.name) + (c.incumbent ? '<span class="inc">(i)</span>' : "") : "—"}</td>`;
  }
  if (f.key === "adv") {
    if (sp) return `<td class="sp-adv">${sp.party === "DEM" ? "D v D" : "R v R"}</td>`;
    return `<td class="${r.adv > 0 ? "adv-d" : r.adv < 0 ? "adv-r" : ""}">${advText(v)}</td>`;
  }
  const zero = Math.round(v) === 0;
  return `<td class="${f.cls}${zero ? " zero" : ""}">${money(v)}</td>`;
}

let SPEND = null, spendState = "idle";
function loadSpend() {
  if (spendState !== "idle") return;
  spendState = "loading";
  fetch("spend.json", {cache: "no-store"}).then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(j => { SPEND = j; spendState = "ready"; render(); })
    .catch(() => { spendState = "error"; render(); });
}

function spPanel(r, s) {
  const total = s.cats.reduce((a, c) => a + Math.max(c[1], 0), 0) || 1;
  const max = Math.max(...s.cats.map(c => c[1]), 1);
  const cats = s.cats.map(([name, v]) => `<span${filtering() && state.cats.has(name) ? ' class="sel"' : ""}>${esc(name)}</span><div class="track"><div class="fill" style="width:${Math.max(v, 0) / max * 100}%"></div></div><span class="v">${money(v)}<span class="pct">${Math.round(Math.max(v, 0) / total * 100)}%</span></span>`).join("");
  let items;
  if (spendState === "ready") {
    const all = (SPEND[r.district] || {})[s.key] || [];
    const list = filtering() ? all.filter(x => state.cats.has(x[2])) : all;
    const oneTarget = new Set(list.map(x => x[5])).size <= 1;
    items = list.map(x => `<div class="it"><span class="dt">${esc(fmtDate(x[0]))}</span><span class="ds">${esc(x[3] || "No description filed")}</span><span class="n">${money(x[1])}</span>` +
      `<span class="sub">${esc([x[2], x[4], oneTarget ? "" : x[5]].filter(Boolean).join(" · "))}</span></div>`).join("") || `<div class="loading">No itemized expenditures.</div>`;
  } else if (spendState === "error") {
    items = `<div class="loading">Expenditure detail couldn't be loaded. It's available once the page is published (spend.json).</div>`;
  } else {
    items = `<div class="loading">Loading expenditures…</div>`;
  }
  const fec = s.id ? `<div class="fec"><a href="https://www.fec.gov/data/committee/${esc(s.id)}/" target="_blank" rel="noopener">${esc(s.name)} on FEC.gov</a></div>` : "";
  const top = s.kind === "COORD" || !s.cats.length ? "" : `<div class="cats">${cats}</div>`;
  return `<div class="sp-panel">${top}<div class="items"${top ? "" : ' style="margin-top:0;border-top:0"'}>${items}</div>${fec}</div>`;
}

function detail(r) {
  const block = (side, title) => {
    const list = r.spenders.filter(s => s.side === side);
    if (!list.length) return `<div class="side-${side.toLowerCase()}"><h3>${title}</h3><div class="sp"><span class="meta">No reported spending.</span></div></div>`;
    const colLabel = k => (COLS.find(c => c.key === k) || {}).label || k;
    return `<div class="side-${side.toLowerCase()}"><h3>${title}</h3>` + list.map(s => {
      const open = state.openSp.has(`${r.district}|${s.key}`);
      return `
      <div class="sp" data-sp="${esc(s.key)}" data-d="${esc(r.district)}" tabindex="0" role="button" aria-expanded="${open}"><span class="nm"><span class="chev" aria-hidden="true"></span>${esc(s.name)}<span class="tag">${esc(colLabel(s.col))}${s.kind === "COORD" ? " coordinated" : ""}</span></span>
      <span class="am">${money(s.amount)}</span>
      <span class="meta">${esc(s.targets.join("; "))}. ${s.n} ${s.kind === "COORD" ? "coordinated " : ""}${s.n === 1 ? "expenditure" : "expenditures"}, latest ${esc(fmtDate(s.last))}.</span>${open ? spPanel(r, s) : ""}</div>`;
    }).join("") + `</div>`;
  };
  return `<tr class="detail"><td colspan="${FIELDS.length}"><div class="detail-inner">
    ${block("R", "Helping Republicans " + money(r.r_total))}${block("D", "Helping Democrats " + money(r.d_total))}

}

  const rN = FIELDS.filter(f => f.side === "R").length, dN = FIELDS.filter(f => f.side === "D").length;

    <h4>How rows are counted</h4>
    <p>${n(s.rows_in_file)} rows in the file, ${n(s.rows_house_general)} for House general elections. When a filing is amended, only the newest version is kept (${n(s.dropped_amended)} superseded rows dropped). Identical transactions filed twice are counted once (${n(s.dropped_duplicate)} dropped). ${n(s.rows_counted)} rows counted.</p>
    <p>Money goes to a side by who it helps: supporting a Republican or opposing a Democrat is R-side. REP and DEM are the candidate on each side with the most IE money. Expenditures disclosed only on monthly or quarterly reports, without a 24/48-hour notice, are not in this file. Filings with a blank office, state or district are filled in from the candidate's FEC ID (${n((s.recovered_office || 0) + (s.recovered_state || 0) + (s.recovered_district || 0))} fields recovered).</p>
    <p>Filings that leave the candidate ID blank are matched to a candidate by last name within the race (${n(s.recovered_candidate_id)} rows matched).</p>
    <p>Party coordinated expenditures come from the FEC's committee-to-candidate file (transaction type 24C, ${n(s.rows_coordinated)} rows, general election only)${DATA.source_coordinated?.last_modified ? `, last updated by the FEC ${esc(DATA.source_coordinated.last_modified)}` : ""}${DATA.source_coordinated?.latest_transaction ? `; the latest coordinated expenditure in it is dated ${esc(fmtDate(DATA.source_coordinated.latest_transaction))}` : ""}. Parties disclose coordinated spending only on their monthly and pre-general reports, so recent spending appears weeks later. Memo entries count unless a matching payment is reported.</p>
    ${(() => { const nf = DATA.source_new_filings || {}; const fl = (nf.filings || []).slice().reverse();
      return `<h4>New 24/48-hour reports read directly</h4>
      <p>The FEC's bulk file has filings received through ${esc(fmtDate(nf.bulk_latest))}. Reports filed since then are read straight from the filings, ${n(fl.length)} so far.${nf.error ? ` <strong>Problem:</strong> ${esc(nf.error)}.` : ""}</p>
      ${fl.length ? tbl(["Filer", "Form", "Filed", "FEC file #", "Lines"], fl.slice(0, 40).map(f => `<tr><td>${esc(f.committee_name)}</td><td>${esc(f.form_type)}</td><td>${esc(fmtDate(f.receipt_date))}</td><td><a href="https://docquery.fec.gov/cgi-bin/forms/${esc(f.committee_id)}/${esc(f.file_number)}/" target="_blank" rel="noopener">${esc(f.file_number)}</a></td><td class="n">${f.rows}</td></tr>`)) : ""}`; })()}
    ${(() => { const sc = DATA.source_coordinated || {}; const rp = sc.reports || [];
      return `<h4>Party reports read directly</h4>
      <p>Coordinated spending in these reports is read from the filings as filed, so it counts the day the party files. Earlier periods come from the FEC's processed bulk file.${sc.raw_error ? ` <strong>Problem:</strong> ${esc(sc.raw_error)}.` : ""}</p>
      ${tbl(["Party", "Report period", "Filed", "FEC file #", "Coordinated lines", "Amount"], rp.slice().reverse().map(r => `<tr><td>${esc(r.label)}</td><td>${esc(fmtDate(r.start))} to ${esc(fmtDate(r.end))}</td><td>${esc(fmtDate(r.receipt_date))}</td><td><a href="https://docquery.fec.gov/cgi-bin/forms/${esc(r.committee_id)}/${esc(r.file_number)}/" target="_blank" rel="noopener">${esc(r.file_number)}</a></td><td class="n">${r.rows}</td><td class="n">${money(r.amount)}</td></tr>`))}`; })()}
    <h4>Where each column's money went</h4>
    <p>Spending by each named group that the FEC file contains but the table does not count, by reason. Check this first if a column looks low. Primary-coded money is usually genuine primary spending; rows dated after a race's primary are the ones to question. Row-level detail: <a href="not_counted.csv">not_counted.csv</a>.</p>
    ${tbl(["Column", "Counted IEs", "Counted coordinated", "Not counted"], (g.reconciliation || []).map(c => `<tr><td>${esc(c.label)}</td><td class="n">${money(c.counted_ie)}</td><td class="n">${c.coordinated ? money(c.counted_coordinated) : ""}</td><td>${Object.entries(c.not_counted).map(([k, v]) => `${esc(k)}: ${money(v)}`).join("<br>") || "Nothing"}</td></tr>`))}
    <h4 id="groups">Biggest groups without their own column</h4>
    <p>Add any of these to config.toml to break them out.</p>
    ${["R","D"].map(sd => tbl([sd === "R" ? "Helping Republicans" : "Helping Democrats", "Races", "Amount"],
      (g.top_other?.[sd] || []).map(o => `<tr><td>${esc(o.name)} <span style="opacity:.6">${esc(o.id)}</span></td><td class="n">${o.races}</td><td class="n">${money(o.amount)}</td></tr>`))).join("")}
    <h4>Candidates with no usable party (not counted)</h4>
    ${tbl(["Candidate", "District", "Amount"], (g.unassigned || []).map(u => `<tr><td>${esc(u.name)} <span style="opacity:.6">${esc(u.key)}</span></td><td>${esc(u.district)}</td><td class="n">${money(u.amount)}</td></tr>`))}
    <p>Fix these with a party override in config.toml.</p>
    <h4>Party checks</h4>
    ${tbl(["Candidate", "District", "Filers report", "FEC lists", "Counted as"], (g.party_notes || []).map(p => `<tr><td>${esc(p.name)} <span style="opacity:.6">${esc(p.key)}</span></td><td>${esc(p.district)}</td><td>${esc(p.filers_say)}</td><td>${esc(p.fec_master_says)}</td><td>${esc(p.counted_as)}</td></tr>`))}
    <h4>Possible double counts</h4>
    <p>Pairs where the counted total exceeds the filer's own reported aggregate by more than 5%.</p>
    ${tbl(["Group", "Candidate", "District", "Counted", "Filer aggregate"], (g.possible_double_counts || []).map(o => `<tr><td>${esc(o.spender)}</td><td>${esc(o.candidate)}</td><td>${esc(o.district)}</td><td class="n">${money(o.counted)}</td><td class="n">${money(o.filer_aggregate)}</td></tr>`))}`;
}

const coordCols = COLS.filter(c => c.coordinated).map(c => c.label);
if (coordCols.length) $("#foot").textContent = `* ${coordCols.join(" and ")} include party coordinated expenditures as well as independent expenditures. Coordinated spending appears only once the party files its monthly report, so it lags IEs by weeks.`;
if (DATA.races.some(r => r.same_party)) $("#foot").textContent += " D v D / R v R: top-two races where both nominees are from the same party; all spending there is counted on that party's side.";
$("#title").textContent = DATA.title;
document.title = DATA.title;
$("#kicker").textContent = `General election · Updated ${DATA.generated_label} · FEC filings through ${fmtDate(DATA.as_of)}`;
document.querySelectorAll("[data-open-notes]").forEach(a => a.addEventListener("click", () => { $("#notes").open = true; }));
if (DATA.note) { $("#note").hidden = false; $("#note").textContent = DATA.note; }

$("#q").addEventListener("input", e => { state.q = e.target.value; render(); });
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => { state.view = b.dataset.view; render(); }));
const toggleRow = tr => { const d = tr.dataset.d; state.open.has(d) ? state.open.delete(d) : state.open.add(d); render(); document.querySelector(`tr.race[data-d="${d}"]`)?.focus(); };
const sortBy = th => { const k = th.dataset.key; if (state.sort === k) state.dir *= -1; else { state.sort = k; state.dir = NUMERIC.has(k) || k === "pres" ? -1 : 1; } render(); document.querySelector(`th[data-key="${k}"]`)?.focus(); };
const toggleSp = el => {
  const k = `${el.dataset.d}|${el.dataset.sp}`;
  state.openSp.has(k) ? state.openSp.delete(k) : state.openSp.add(k);
  loadSpend(); render();
  document.querySelector(`.sp[data-d="${el.dataset.d}"][data-sp="${CSS.escape(el.dataset.sp)}"]`)?.focus();
};
$("#tbl").addEventListener("click", e => {
  if (e.target.closest("a")) return;
  if (e.target.closest(".sp-panel")) return;
  const sp = e.target.closest(".sp[data-sp]"); if (sp) return toggleSp(sp);
  const th = e.target.closest("th[data-key]"); if (th) return sortBy(th);
  const tr = e.target.closest("tr.race"); if (tr) toggleRow(tr);
});
$("#tbl").addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const sp = e.target.closest(".sp[data-sp]");
  if (sp && e.target === sp) { e.preventDefault(); return toggleSp(sp); }
  const th = e.target.closest("th[data-key]"), tr = e.target.closest("tr.race");
  if (th || tr) { e.preventDefault(); th ? sortBy(th) : toggleRow(tr); }
});
const ORDER = ["Paid Media (general)", "Broadcast", "Cable", "CTV/Streaming", "Radio", "Digital (general)", "Production",
               "Direct Mail", "Canvassing/Lit", "Phones", "Texting", "Other"];
const catList = [...ORDER.filter(c => (DATA.categories || []).includes(c)), ...(DATA.categories || []).filter(c => !ORDER.includes(c))];
state.cats = new Set(catList);
$("#catboxes").innerHTML = catList.map(c => `<label><input type="checkbox" value="${esc(c)}"> ${esc(c)}</label>`).join("");
function catLabel() {
  const n = state.cats.size, picked = catList.filter(c => state.cats.has(c));
  return n === catList.length ? "All" : !n ? "None" : n <= 2 ? picked.join(" + ") : `${n} types`;
}
function applyCats() {
  document.querySelectorAll("#catboxes input").forEach(b => { b.checked = state.cats.has(b.value); });
  $("#catsum").textContent = catLabel();
  $("#catpick").classList.toggle("on", filtering());
  const note = $("#catnote");
  note.hidden = !filtering();
  if (filtering()) note.textContent = state.cats.size
    ? `Showing ${catList.filter(c => state.cats.has(c)).join(", ")} spending only. Party coordinated spending isn't broken out by type, so NRCC* and DCCC* show independent expenditures only.`
    : "No spending types selected. Check at least one type, or choose Select all.";
  render();
}
$("#catboxes").addEventListener("change", e => {
  if (!e.target.matches("input")) return;
  e.target.checked ? state.cats.add(e.target.value) : state.cats.delete(e.target.value);
  applyCats();
});
$("#catall").addEventListener("click", () => { state.cats = new Set(catList); applyCats(); });
$("#catclear").addEventListener("click", () => { state.cats.clear(); applyCats(); });
document.addEventListener("click", e => { if (!e.target.closest("#catpick")) $("#catpick").open = false; });
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#catpick").open = false; });
applyCats(); renderNotes();
fetch("status.json", {cache: "no-store"}).then(r => r.ok ? r.json() : null).then(st => {
  if (st) $("#checked").textContent = `Last checked for new filings ${st.last_checked_label} (${st.result}). Checks run hourly and pick up new 24/48-hour reports as they're filed.`;
}).catch(() => {});
</script>
</body>
</html>
